name: Package Linux

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    name: AppImage and Debian (${{ matrix.package_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
            appimage_arch: x86_64
          - package_arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            appimage_arch: aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="$RELEASE_VERSION"
          else
            version="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget xauth xvfb \
            extra-cmake-modules libcurl4-gnutls-dev libpcap0.8-dev \
            libsdl2-dev libarchive-dev libzstd-dev libenet-dev libfaad-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libfuse2 \
            qtbase5-dev qtbase5-private-dev qtmultimedia5-dev \
            libqt5svg5-dev libqt5websockets5-dev qtwayland5 dpkg-dev zstd

      - name: Enable matching source packages
        run: |
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            grep '^deb ' /etc/apt/sources.list | sed 's/^deb /deb-src /' | \
              sudo tee /etc/apt/sources.list.d/widemelon-source.list >/dev/null
          fi
          sudo apt-get update

      - name: Build and test
        env:
          WIDEMELON_USE_QT6: "0"
        run: ./scripts/build.sh

      - name: Generate architecture-independent application source input
        if: matrix.package_arch == 'x86_64'
        run: ./scripts/package-source.sh "$VERSION"

      - name: Build Debian package
        run: |
          deb_version=${VERSION/-dev./~dev.}
          cmake -S . -B build/deb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_LTO_RELEASE=OFF -DUSE_QT6=OFF \
            -DWIDEMELON_ENABLE_DEB=ON \
            -DWIDEMELON_DEBIAN_ARCHITECTURE="${{ matrix.deb_arch }}" \
            -DWIDEMELON_PACKAGE_VERSION="$deb_version"
          cmake --build build/deb --parallel
          cpack --config build/deb/CPackConfig.cmake -B dist -G DEB
          if [[ "$deb_version" != "$VERSION" ]]; then
            mv "dist/widemelon_${deb_version}-1_${{ matrix.deb_arch }}.deb" \
              "dist/widemelon_${VERSION}-1_${{ matrix.deb_arch }}.deb"
          fi
          package="dist/widemelon_${VERSION}-1_${{ matrix.deb_arch }}.deb"
          [[ "$(dpkg-deb --field "$package" Architecture)" == "${{ matrix.deb_arch }}" ]]
          dpkg-deb --info "$package"

      - name: Test Debian package
        run: |
          sudo apt-get install --yes "./dist/widemelon_${VERSION}-1_${{ matrix.deb_arch }}.deb"
          xvfb-run -a widemelon --help

      - name: Stage application
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_LTO_RELEASE=OFF -DUSE_QT6=OFF
          DESTDIR="$GITHUB_WORKSPACE/build/AppDir" cmake --install build

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: ${{ matrix.appimage_arch }}
          EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
          EXTRA_QT_MODULES: "waylandcompositor"
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          mkdir -p build/appimage-tools
          wget --quiet -P build/appimage-tools \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage
          wget --quiet -P build/appimage-tools \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.appimage_arch }}.AppImage
          chmod +x build/appimage-tools/*.AppImage
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/dist/WideMelon-${VERSION}-${{ matrix.appimage_arch }}.AppImage"
          build/appimage-tools/linuxdeploy-${{ matrix.appimage_arch }}.AppImage \
            --appdir build/AppDir --plugin qt --output appimage
          xvfb-run -a "$LDAI_OUTPUT" --appimage-extract-and-run --help

      - name: Archive bundled-library sources
        run: ./scripts/package-third-party-source.sh "$VERSION" build/AppDir "linux-${{ matrix.package_arch }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-${{ matrix.package_arch }}-appimage
          path: dist/WideMelon-${{ env.VERSION }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-${{ matrix.package_arch }}-debian
          path: dist/widemelon_${{ env.VERSION }}-1_${{ matrix.deb_arch }}.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload application source input
        if: matrix.package_arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-application-source
          path: dist/widemelon-${{ env.VERSION }}-source.tar.xz
          if-no-files-found: error

      - name: Upload bundled-library source input
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-${{ matrix.package_arch }}-source
          path: dist/widemelon-${{ env.VERSION }}-linux-${{ matrix.package_arch }}-third-party-source.tar.xz
          if-no-files-found: error
          retention-days: 1
